<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>at.tension Show Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>at.tension Show Planner</h1>
    <p>Wähle deine Shows und exportiere deinen persönlichen Plan.</p>
  </header>

  <main>
    <section id="calendar">
      <h2>Kalender</h2>
      <div class="calendar-controls">
        <label>
          Tag:
          <select id="day-filter"></select>
        </label>
      </div>
      <div id="calendar-grid"></div>
    </section>

    <section id="plan">
      <h2>Mein Plan</h2>
      <ul id="plan-list"></ul>
      <div class="actions">
        <button id="btn-print">Als PDF (Drucken)</button>
        <button id="btn-ical">Als iCal (.ics)</button>
      </div>
    </section>
  </main>

  <footer>
    <small>© 2026 theYeshir · at.tension Show Planner</small>
  </footer>

  <!-- Detail-Modal -->
  <div id="detail-modal" class="modal" aria-hidden="true">
    <div class="modal-overlay" data-close-modal></div>
    <div class="modal-content">
      <button class="modal-close" data-close-modal>&times;</button>
      <h3 id="detail-title"></h3>
      <p class="detail-meta" id="detail-meta"></p>
      <p class="detail-description" id="detail-description"></p>
      <p class="detail-extra" id="detail-extra"></p>
      <p id="detail-link-container"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
